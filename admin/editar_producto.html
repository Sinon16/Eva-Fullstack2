<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto - Admin</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin-layout">

    <aside class="admin-sidebar">
        <div class="logo">
            <span class="logo-icon">🍔</span>
            <h1>Sabor & Aroma</h1>
        </div>
        
        <nav class="sidebar-nav">
            <ul>
                <li><a href="index.html">🏠 Dashboard</a></li>
                
                <li class="nav-category">Gestión de Productos</li>
                <li><a href="mostrar_productos.html" class="active">📦 Listar Productos</a></li>
                <li><a href="nuevo_producto.html">➕ Nuevo Producto</a></li>
                
                <li class="nav-category">Gestión de Usuarios</li>
                <li><a href="mostrar_usuarios.html">👥 Listar Usuarios</a></li>
                <li><a href="nuevo_usuario.html">➕ Nuevo Usuario</a></li>

                <li class="nav-category">Sistema</li>
                <li><a href="#" id="btn-salir" style="color: #ff4d4d;">🚪 Cerrar Sesión</a></li>
            </ul>
        </nav>
    </aside>

    <main class="admin-main">
        <button id="btn-menu" class="btn-menu-movil">☰ Menú</button>
        <header class="admin-header">
            <h1>Editar Producto</h1>
        </header>

        <section class="dashboard-content">
            <div class="form-card" style="margin: 0 auto;">
                <h2 style="color: var(--primary-color); margin-bottom: 1.5rem; text-align: center;">Modificar Detalles</h2>
                
                <form id="form-editar-producto">
                    <div class="form-group">
                        <label for="codigo">Código del Producto *</label>
                        <input type="text" id="codigo" name="codigo" minlength="3" readonly required>
                        <span class="error-message" id="error-codigo"></span>
                    </div>

                    <div class="form-group">
                        <label for="nombre">Nombre del Producto *</label>
                        <input type="text" id="nombre" name="nombre" maxlength="100" required>
                        <span class="error-message" id="error-nombre"></span>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="precio">Precio *</label>
                            <input type="number" id="precio" name="precio" min="0" step="any" required>
                            <span class="error-message" id="error-precio"></span>
                        </div>
                        
                        <div class="form-group">
                            <label for="stock">Stock *</label>
                            <input type="number" id="stock" name="stock" min="0" step="1" value="0" required>
                            <span class="error-message" id="error-stock"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="categoria">Categoría *</label>
                        <select id="categoria" name="categoria" required>
                            <option value="">Seleccione una categoría</option>
                            <option value="pizzas-hamburguesas">Pizzas y Hamburguesas</option>
                            <option value="saludable">Opción Saludable</option>
                            <option value="postres">Postres</option>
                            <option value="bebidas">Bebidas y Batidos</option>
                            <option value="ofertas">Ofertas</option>
                        </select>
                        <span class="error-message" id="error-categoria"></span>
                    </div>

                    <div class="form-group">
                        <label for="imagen">Cambiar Imagen (Opcional)</label>
                        <input type="file" id="imagen" name="imagen" accept="image/*">
                        <small style="color: #666;">Si no seleccionas nada, se mantendrá la foto actual.</small>
                    </div>

                    <button type="submit" class="btn-primary form-btn">Actualizar Producto</button>
                </form>

            </div>
        </section>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let parametros = new URLSearchParams(window.location.search);
            let codigoFiltro = parametros.get("codigo");

            if (codigoFiltro != null) {
                let memoria = localStorage.getItem("productosTienda");
                
                if (memoria != null) {
                    let listaProductos = JSON.parse(memoria);
                    
                    for (let i = 0; i < listaProductos.length; i++) {
                        let producto = listaProductos[i];
                        
                        if (producto.codigo === codigoFiltro) {
                            document.getElementById("codigo").value = producto.codigo;
                            document.getElementById("nombre").value = producto.nombre;
                            document.getElementById("precio").value = producto.precio;
                            
                            let selectCategoria = document.getElementById("categoria");
                            if (selectCategoria != null) {
                                selectCategoria.value = producto.categoria;
                            }
                        }
                    }
                }
            }
        });
    </script>

    <script src="../js/validaciones_admin.js"></script>
</body>
</html>
