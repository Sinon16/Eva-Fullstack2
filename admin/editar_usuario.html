<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario - Admin</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin-layout">

    <aside class="admin-sidebar">
        <div class="logo">
            <span class="logo-icon">🍔</span>
            <h1>Sabor & Aroma</h1>
        </div>
        
        <nav class="sidebar-nav">
            <ul>
                <li><a href="index.html">🏠 Dashboard</a></li>
                
                <li class="nav-category">Gestión de Productos</li>
                <li><a href="mostrar_productos.html">📦 Listar Productos</a></li>
                <li><a href="nuevo_producto.html">➕ Nuevo Producto</a></li>
                
                <li class="nav-category">Gestión de Usuarios</li>
                <li><a href="mostrar_usuarios.html" class="active">👥 Listar Usuarios</a></li>
                <li><a href="nuevo_usuario.html">➕ Nuevo Usuario</a></li>
                
                <li class="nav-category">Sistema</li>
                <li><a href="#" id="btn-salir" style="color: #ff4d4d;">🚪 Cerrar Sesión</a></li>
            </ul>
        </nav>
    </aside>

    <main class="admin-main">
        <button id="btn-menu" class="btn-menu-movil">☰ Menú</button>
        <header class="admin-header">
            <h1>Editar Usuario</h1>
        </header>

        <section class="dashboard-content">
            <div class="form-card" style="margin: 0 auto; max-width: 600px;">
                <h2 style="color: var(--primary-color); margin-bottom: 1.5rem; text-align: center;">Actualizar Datos</h2>
                
                <form id="form-editar-usuario">
                    <div class="form-group">
                        <label for="run">RUN (Sin puntos ni guion) *</label>
                        <!-- Sin value fijo, autocompletaremos -->
                        <input type="text" id="run" name="run" minlength="7" maxlength="9" readonly required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="nombreUsuario">Nombre *</label>
                            <input type="text" id="nombreUsuario" name="nombreUsuario" maxlength="50" required>
                            <span class="error-message" id="error-nombreUsuario"></span>
                        </div>
                        <div class="form-group">
                            <label for="apellidos">Apellidos (Opcional)</label>
                            <input type="text" id="apellidos" name="apellidos" maxlength="100">
                            <span class="error-message" id="error-apellidos"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="correo">Correo Electrónico *</label>
                        <input type="email" id="correo" name="correo" maxlength="100" required>
                        <span class="error-message" id="error-correo"></span>
                    </div>

                    <div class="form-group">
                        <label for="rol">Tipo de Usuario *</label>
                        <select id="rol" name="rol" required>
                            <option value="">Seleccione un perfil</option>
                            <option value="Administrador">Administrador</option>
                            <option value="Vendedor">Vendedor</option>
                            <option value="Cliente">Cliente</option>
                        </select>
                        <span class="error-message" id="error-rol"></span>
                    </div>

                    <!-- Usamos el mismo select limpio que en registro -->
                    <div class="form-group">
                        <label for="region">Región *</label>
                        <select id="region" name="region" required>
                            <option value="">-- Seleccione la región --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="comuna">Comuna *</label>
                        <select id="comuna" name="comuna" required disabled>
                            <option value="">-- Seleccione la comuna --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="direccion">Dirección *</label>
                        <input type="text" id="direccion" name="direccion" maxlength="300" required>
                        <span class="error-message" id="error-direccion"></span>
                    </div>

                    <button type="submit" class="btn-primary form-btn">Actualizar Usuario</button>
                </form>

            </div>
        </section>

    </main>

    <!-- Script Maestro: Regiones, Autocompletado y Redirección -->

            "Aysén": ["Coyhaique", "Lago Verde", "Aysén", "Cisnes", "Guaitecas", "Cochrane", "O'Higgins", "Tortel", "Chile Chico", "Río Ibáñez"],
            "Magallanes": ["Punta Arenas", "Laguna Blanca", "Río Verde", "San Gregorio", "Cabo de Hornos", "Antártica", "Porvenir", "Primavera", "Timaukel", "Natales", "Torres del Paine"]
        };

        document.addEventListener("DOMContentLoaded", function () {
            // 1. Cargar las regiones en el select
            const selectRegion = document.getElementById("region");
            const selectComuna = document.getElementById("comuna");

            for (let region in regionesYComunas) {
                let opcion = document.createElement("option");
                opcion.value = region;
                opcion.textContent = region;
                selectRegion.appendChild(opcion);
            }

            // 2. Comportamiento dinámico de las comunas
            selectRegion.addEventListener("change", function () {
                const regionSeleccionada = this.value;
                selectComuna.innerHTML = '<option value="">-- Seleccione la comuna --</option>';

                if (regionSeleccionada !== "") {
                    selectComuna.disabled = false;
                    const comunas = regionesYComunas[regionSeleccionada];

                    for (let i = 0; i < comunas.length; i++) {
                        let opcion = document.createElement("option");
                        opcion.value = comunas[i];
                        opcion.textContent = comunas[i];
                        selectComuna.appendChild(opcion);
                    }
                } else {
                    selectComuna.disabled = true;
                }
            });

            // 3. Autocompletar con los datos de la memoria
            let memoria = localStorage.getItem("usuarioRegistrado");
            if (memoria != null) {
                let u = JSON.parse(memoria);
                
                document.getElementById("nombreUsuario").value = u.nombre;
                
                let campoCorreo = document.getElementById("correo");
                campoCorreo.value = u.email;
                campoCorreo.setAttribute("readonly", "true"); 
                
                if (u.esAdmin === true) {
                    document.getElementById("rol").value = "Administrador";
                } else {
                    document.getElementById("rol").value = "Cliente";
                }

                document.getElementById("run").value = "12345678-9";
                document.getElementById("direccion").value = "Dirección de Prueba 123";
            }
        });
    </script>

    <script src="../js/validaciones_admin.js"></script>
</body>
</html>
