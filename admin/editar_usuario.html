<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario - Admin</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin-layout">

    <aside class="admin-sidebar">
        <header class="sidebar-header">
            <h2>🍔 FoodStore Admin</h2>
        </header>
        
        <nav class="sidebar-nav">
            <ul>
                <li><a href="index.html">🏠 Dashboard</a></li>
                
                <li class="nav-category">Gestión de Productos</li>
                <li><a href="mostrar_productos.html">📦 Listar Productos</a></li>
                <li><a href="nuevo_producto.html">➕ Nuevo Producto</a></li>
                
                <li class="nav-category">Gestión de Usuarios</li>
                <li><a href="mostrar_usuarios.html" class="active">👥 Listar Usuarios</a></li>
                <li><a href="nuevo_usuario.html">➕ Nuevo Usuario</a></li>
            </ul>
        </nav>
    </aside>

    <main class="admin-main">
        
        <header class="admin-header">
            <h1>Editar Usuario</h1>
        </header>

        <section class="dashboard-content">
            <div class="form-card" style="margin: 0 auto; max-width: 600px;">
                <h2 style="color: var(--primary-color); margin-bottom: 1.5rem; text-align: center;">Actualizar Datos</h2>
                
                <form id="form-editar-usuario">
                    <div class="form-group">
                        <label for="run">RUN (Sin puntos ni guion) *</label>
                        <!-- El RUN suele ser de solo lectura en las ediciones (readonly) -->
                        <input type="text" id="run" name="run" minlength="7" maxlength="9" value="19011022K" readonly required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="nombreUsuario">Nombre *</label>
                            <input type="text" id="nombreUsuario" name="nombreUsuario" maxlength="50" value="Juan" required>
                            <span class="error-message" id="error-nombreUsuario"></span>
                        </div>
                        <div class="form-group">
                            <label for="apellidos">Apellidos *</label>
                            <input type="text" id="apellidos" name="apellidos" maxlength="100" value="Pérez" required>
                            <span class="error-message" id="error-apellidos"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="correo">Correo Electrónico *</label>
                        <input type="email" id="correo" name="correo" maxlength="100" value="juan@duoc.cl" required>
                        <span class="error-message" id="error-correo"></span>
                    </div>

                    <div class="form-group">
                        <label for="rol">Tipo de Usuario *</label>
                        <select id="rol" name="rol" required>
                            <option value="">Seleccione un perfil</option>
                            <option value="Administrador" selected>Administrador</option>
                            <option value="Vendedor">Vendedor</option>
                            <option value="Cliente">Cliente</option>
                        </select>
                        <span class="error-message" id="error-rol"></span>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="region">Región</label>
                            <select id="region" name="region">
                                <option value="">Seleccione Región</option>
                                <!-- Se llenará con JS -->
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="comuna">Comuna</label>
                            <select id="comuna" name="comuna">
                                <option value="">Seleccione Comuna</option>
                                <!-- Se llenará con JS -->
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="direccion">Dirección *</label>
                        <input type="text" id="direccion" name="direccion" maxlength="300" value="Av. Concha y Toro 123" required>
                        <span class="error-message" id="error-direccion"></span>
                    </div>

                    <button type="submit" class="btn-primary form-btn">Actualizar Usuario</button>
                </form>

            </div>
        </section>

    </main>
</body>
</html>
