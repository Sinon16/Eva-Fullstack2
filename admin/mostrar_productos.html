<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Productos - Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <!-- CSS de DataTables (Vía CDN) -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
</head>
<body class="admin-layout">

    <aside class="admin-sidebar">
                <div class="logo">
            <span class="logo-icon">🍔</span>
            <h1>Sabor & Aroma</h1>
        </div>
        
        <nav class="sidebar-nav">
            <ul>
                <li><a href="index.html">🏠 Dashboard</a></li>
                
                <li class="nav-category">Gestión de Productos</li>
                <li><a href="mostrar_productos.html" class="active">📦 Listar Productos</a></li>
                <li><a href="nuevo_producto.html">➕ Nuevo Producto</a></li>
                
                <li class="nav-category">Gestión de Usuarios</li>
                <li><a href="mostrar_usuarios.html">👥 Listar Usuarios</a></li>
                <li><a href="nuevo_usuario.html">➕ Nuevo Usuario</a></li>
            </ul>
        </nav>
    </aside>

    <main class="admin-main">
        <button id="btn-menu" class="btn-menu-movil">☰ Menú</button>
        <header class="admin-header">
            <h1>Inventario de Productos</h1>
            <a href="nuevo_producto.html" class="btn-primary">+ Agregar Producto</a>
        </header>

        <section class="table-container">
            <table id="tabla-productos" class="admin-table">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <!-- Dejamos el cuerpo de la tabla vacío para que JS lo llene -->
                <tbody id="body-productos">
                    
                </tbody>
            </table>
        </section>
        
    </main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    
    <!-- Script para leer la memoria e inicializar la tabla en Español -->
    <script>
        $(document).ready(function() {
            // 1. Buscamos los productos en la libreta (memoria del navegador)
            let productosMemoria = JSON.parse(localStorage.getItem("productosTienda")) || [];
            let tbody = document.getElementById("body-productos");
            
            // 2. Por cada producto guardado, creamos una fila en la tabla
            productosMemoria.forEach(p => {
                let fila = `
                    <tr>
                        <td><strong>${p.codigo || 'N/A'}</strong></td>
                        <td>${p.nombre}</td>
                        <td>${p.categoria}</td>
                        <td>$${p.precio}</td>
                        <td class="badge-vendedor">Disponible</td>
                        <td>
                            <a href="editar_producto.html" class="action-link action-edit">Editar</a>
                            <a href="#" class="action-link action-delete">Eliminar</a>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += fila;
            });

            // 3. Recién AHORA que la tabla tiene datos, encendemos el plugin DataTables
            $('#tabla-productos').DataTable({
                "language": {
                    "url": "https://cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json"
                }
            });
        });
    </script>
    <script src="../js/validaciones_admin.js"></script>
</body>
</html>
