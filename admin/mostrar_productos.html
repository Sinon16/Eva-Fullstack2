<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Productos - Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <!-- CSS de DataTables (Vía CDN) -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
</head>
<body class="admin-layout">

    <aside class="admin-sidebar">
        <div class="logo">
            <span class="logo-icon">🍔</span>
            <h1>Sabor & Aroma</h1>
        </div>
        
        <nav class="sidebar-nav">
            <ul>
                <li><a href="index.html">🏠 Dashboard</a></li>
                
                <li class="nav-category">Gestión de Productos</li>
                <li><a href="mostrar_productos.html" class="active">📦 Listar Productos</a></li>
                <li><a href="nuevo_producto.html">➕ Nuevo Producto</a></li>
                
                <li class="nav-category">Gestión de Usuarios</li>
                <li><a href="mostrar_usuarios.html">👥 Listar Usuarios</a></li>
                <li><a href="nuevo_usuario.html">➕ Nuevo Usuario</a></li>

                <li class="nav-category">Sistema</li>
                <li><a href="#" id="btn-salir" style="color: #ff4d4d;">🚪 Cerrar Sesión</a></li>
            </ul>
        </nav>
    </aside>

    <main class="admin-main">
        <button id="btn-menu" class="btn-menu-movil">☰ Menú</button>
        <header class="admin-header">
            <h1>Inventario de Productos</h1>
            <a href="nuevo_producto.html" class="btn-primary">+ Agregar Producto</a>
        </header>

        <section class="table-container">
            <table id="tabla-productos" class="admin-table">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="body-productos">
                    
                </tbody>
            </table>
        </section>
        
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    
    <script>
        $(document).ready(function() {
            let memoria = localStorage.getItem("productosTienda");
            let productos = [];
            
            if (memoria != null) {
                productos = JSON.parse(memoria);
            }
            
            let tbody = document.getElementById("body-productos");
            
            for (let i = 0; i < productos.length; i++) {
                let p = productos[i];
                let codigoMostrar = "N/A";
                if (p.codigo != null) {
                    codigoMostrar = p.codigo;
                }

                let fila = "<tr>";
                fila += "<td><strong>" + codigoMostrar + "</strong></td>";
                fila += "<td>" + p.nombre + "</td>";
                fila += "<td>" + p.categoria + "</td>";
                fila += "<td>$" + p.precio + "</td>";
                fila += "<td class='badge-vendedor'>Disponible</td>";
                fila += "<td>";
                fila += "<a href='editar_producto.html?codigo=" + p.codigo + "' class='action-link action-edit'>Editar</a> ";
                fila += "<a href='#' class='action-link action-delete' onclick='eliminarProducto(\"" + p.codigo + "\")'>Eliminar</a>";
                fila += "</td>";
                fila += "</tr>";
                
                tbody.innerHTML += fila;
            }

            $('#tabla-productos').DataTable({
                "language": {
                    "url": "https://cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json"
                }
            });
        });

        function eliminarProducto(codigoEliminar) {
            let confirmar = confirm("¿Estás seguro de que deseas eliminar este producto?");
            
            if (confirmar === true) {
                let memoria = localStorage.getItem("productosTienda");
                
                if (memoria != null) {
                    let listaProductos = JSON.parse(memoria);
                    let nuevaLista = [];
                    
                    for (let i = 0; i < listaProductos.length; i++) {
                        if (listaProductos[i].codigo !== codigoEliminar) {
                            nuevaLista.push(listaProductos[i]);
                        }
                    }
                    
                    localStorage.setItem("productosTienda", JSON.stringify(nuevaLista));
                    alert("¡Producto eliminado correctamente!");
                    window.location.reload();
                }
            }
        }
    </script>
    <script src="../js/validaciones_admin.js"></script>
</body>
</html>
