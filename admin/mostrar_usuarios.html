<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Usuarios - Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
</head>
<body class="admin-layout">

    <aside class="admin-sidebar">
         <div class="logo">
            <span class="logo-icon">🍔</span>
            <h1>Sabor & Aroma</h1>
        </div>
        
        <nav class="sidebar-nav">
            <ul>
                <li><a href="index.html">🏠 Dashboard</a></li>
                
                <li class="nav-category">Gestión de Productos</li>
                <li><a href="mostrar_productos.html">📦 Listar Productos</a></li>
                <li><a href="nuevo_producto.html">➕ Nuevo Producto</a></li>
                
                <li class="nav-category">Gestión de Usuarios</li>
                <li><a href="mostrar_usuarios.html" class="active">👥 Listar Usuarios</a></li>
                <li><a href="nuevo_usuario.html">➕ Nuevo Usuario</a></li>
            </ul>
        </nav>
    </aside>

    <main class="admin-main">
        <button id="btn-menu" class="btn-menu-movil">☰ Menú</button>
        <header class="admin-header">
            <h1>Gestión de Usuarios</h1>
            <a href="nuevo_usuario.html" class="btn-primary">+ Agregar Usuario</a>
        </header>

        <section class="table-container">
            <table id="tabla-usuarios" class="admin-table">
                <thead>
                    <tr>
                        <th>RUN</th>
                        <th>Nombre Completo</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="body-usuarios">
                    
                </tbody>
            </table>
        </section>
        
    </main>
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    
    <script>
        $(document).ready(function() {
            let tbody = document.getElementById("body-usuarios");
            let usuariosParaMostrar = [];

            const usuariosPredefinidos = [
                { nombre: "Usuario Gmail", email: "estudiante@gmail.com", esAdmin: false },
                { nombre: "Alumno Duoc", email: "alumno@duoc.cl", esAdmin: false },
                { nombre: "Profesor Duoc (Admin)", email: "profe@profesor.duoc.cl", esAdmin: true }
            ];
            
            usuariosParaMostrar = usuariosParaMostrar.concat(usuariosPredefinidos);

            let usuarioRegistrado = JSON.parse(localStorage.getItem("usuarioRegistrado"));
            
            if (usuarioRegistrado) {
                usuariosParaMostrar.push(usuarioRegistrado);
            }

            usuariosParaMostrar.forEach((u, index) => {
                let runFalso = u.run || `1${index}234567-K`; 
                let rolTexto = u.esAdmin ? "Administrador" : "Cliente";
                let claseRol = u.esAdmin ? "badge-admin" : "badge-cliente";

                let fila = `
                    <tr>
                        <td><strong>${runFalso}</strong></td>
                        <td>${u.nombre}</td>
                        <td>${u.email}</td>
                        <td class="${claseRol}">${rolTexto}</td>
                        <td>
                            <a href="editar_usuario.html" class="action-link action-edit">Editar</a>
                            <a href="#" class="action-link action-delete">Eliminar</a>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += fila;
            });

            $('#tabla-usuarios').DataTable({
                "language": {
                    "url": "https://cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json"
                }
            });
        });
    </script>
    <script src="../js/validaciones_admin.js"></script>

</body>
</html>
