<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Producto - Admin</title>
    <!-- Referencia a tu CSS principal -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin-layout">

    <!-- Menú Lateral -->
    <aside class="admin-sidebar">
        <div class="logo">
            <span class="logo-icon">🍔</span>
            <h1>Sabor & Aroma</h1>
        </div>
        
        <nav class="sidebar-nav">
            <ul>
                <li><a href="index.html">🏠 Dashboard</a></li>
                
                <li class="nav-category">Gestión de Productos</li>
                <li><a href="mostrar_productos.html">📦 Listar Productos</a></li>
                <!-- Marcamos esta opción como activa -->
                <li><a href="nuevo_producto.html" class="active">➕ Nuevo Producto</a></li>
                
                <li class="nav-category">Gestión de Usuarios</li>
                <li><a href="mostrar_usuarios.html">👥 Listar Usuarios</a></li>
                <li><a href="nuevo_usuario.html">➕ Nuevo Usuario</a></li>

                <li class="nav-category">Sistema</li>
                <li><a href="#" id="btn-salir" style="color: #ff4d4d;">🚪 Cerrar Sesión</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Contenido Principal -->
    <main class="admin-main">
        <button id="btn-menu" class="btn-menu-movil">☰ Menú</button>
        <header class="admin-header">
            <h1>Agregar Nuevo Producto</h1>
        </header>

        <section class="dashboard-content">
            <!-- Usamos las clases correctas en lugar de style="..." -->
            <div class="form-card card-center">
                <h2 style="color: var(--primary-color); margin-bottom: 1.5rem; text-align: center;">Detalles del Producto</h2>
                
                <!-- El ID debe coincidir con el que usamos en validaciones_admin.js -->
                <form id="form-nuevo-producto">
                    
                    <div class="form-group">
                        <label for="codigo">Código del Producto *</label>
                        <input type="text" id="codigo" name="codigo" minlength="3" placeholder="Ej: P001" required>
                        <span class="error-message" id="error-codigo"></span>
                    </div>

                    <div class="form-group">
                        <label for="nombre">Nombre del Producto *</label>
                        <input type="text" id="nombre" name="nombre" maxlength="100" placeholder="Ej: Pizza Margarita" required>
                        <span class="error-message" id="error-nombre"></span>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="precio">Precio *</label>
                            <input type="number" id="precio" name="precio" min="0" step="any" placeholder="Ej: 8500" required>
                            <span class="error-message" id="error-precio"></span>
                        </div>
                        
                        <div class="form-group">
                            <label for="stock">Stock *</label>
                            <input type="number" id="stock" name="stock" min="0" step="1" placeholder="Ej: 50" required>
                            <span class="error-message" id="error-stock"></span>
                        </div>
                    </div>

                   <div class="form-group">
                        <label for="categoria">Categoría *</label>
                        <select id="categoria" name="categoria" required>
                            <option value="">Seleccione una categoría</option>
                            <!-- CORRECCIÓN: Estos 'value' ahora son idénticos a los de la tienda -->
                            <option value="pizzas-hamburguesas">Pizzas y Hamburguesas</option>
                            <option value="saludable">Opción Saludable</option>
                            <option value="postres">Postres</option>
                            <option value="bebidas">Bebidas y Batidos</option>
                            <option value="ofertas">Ofertas</option>
                        </select>
                        <span class="error-message" id="error-categoria"></span>
                    </div>

                    <!-- NUEVO CAMPO: Subir Imagen -->
                    <div class="form-group">
                        <label for="imagen">Imagen del Producto (Opcional)</label>
                        <input type="file" id="imagen" name="imagen" accept="image/*">
                        <small style="color: #666;">Selecciona una foto desde tu computador.</small>
                    </div>

                    <button type="submit" class="btn-primary form-btn">Guardar Producto</button>
                </form>

            </div>
        </section>

    </main>

    <!-- Conectamos nuestro "cerebro" de validaciones al final -->
    <script src="../js/validaciones_admin.js"></script>
</body>
</html>
