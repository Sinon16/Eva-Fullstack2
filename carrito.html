<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor & AROMA - Carrito de Comida</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="main-header">
        <div class="logo">
            <span class="logo-icon">🍔</span>
            <h1>Sabor & Aroma</h1>
        </div>
        
        <nav class="navbar">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li class="separator">|</li>
                <li><a href="productos.html">Menú</a></li>
                <li class="separator">|</li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li class="separator">|</li>
                <li><a href="blogs.html">Blog Culinario</a></li>
                <li class="separator">|</li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>

        <div class="cart-action">
            <a href="carrito.html" class="cart-btn" id="cart-counter">🛒 Mi Pedido (0)</a>
        </div>
    </header>

    <div class="user-subbar" id="user-subbar">
        <div class="user-links">
            <a href="login.html">Iniciar sesión</a>
            <span class="separator">|</span>
            <a href="registro.html">Crear cuenta</a>
        </div>
    </div>

    <div class="container">
        <main class="main-content">
            <h2>Mi carrito de compras</h2>
            
            <div class="cart-layout">
                <!-- Lista de productos cargada por JS -->
                <div class="cart-items" id="cart-items-container"></div>

                <!-- Resumen lateral -->
                <div class="cart-summary">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span>TOTAL:</span>
                        <span class="total-price" id="cart-total">$ 0</span>
                    </div>

                    <div style="margin-top: 2rem;">
                        <label for="coupon-code" style="display: block; font-size: 0.85rem; color: #666; margin-bottom: 0.4rem;">Ingrese el cupón de descuento</label>
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="text" id="coupon-code">
                            <button class="btn-aplicar" id="btn-apply-coupon">APLICAR</button>
                        </div>
                    </div>

                    <button class="btn-pay" id="btn-checkout">PAGAR</button>
                </div>
            </div>
        </main>
    </div>

    <footer class="main-footer">
        <p>&copy; 2026 Sabor & Aroma - Comida Real, Sabor Auténtico</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/carrito.js"></script>
</body>
</html>
