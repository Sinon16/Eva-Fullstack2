<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor & AROMA - Contáctanos</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <header class="main-header">
        <div class="logo">
            <span class="logo-icon">🍔</span>
            <h1>Sabor & Aroma</h1>
        </div>
        
        <nav class="navbar">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li class="separator">|</li>
                <li><a href="productos.html">Menú</a></li>
                <li class="separator">|</li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li class="separator">|</li>
                <li><a href="blogs.html">Blog Culinario</a></li>
                <li class="separator">|</li>
                <li><a href="contacto.html" class="active">Contacto</a></li>
            </ul>
        </nav>

        <div class="cart-action">
            <a href="carrito.html" class="cart-btn">🛒 Mi Pedido (0)</a>
        </div>
    </header>

    <div class="user-subbar" id="user-subbar">
        <div class="user-links">
            <a href="login.html">Iniciar sesión</a>
            <span class="separator">|</span>
            <a href="registro.html">Crear cuenta</a>
        </div>
    </div>

    <div class="container">
        <main class="main-content">
            <div class="form-card">
                <h2>Contáctanos</h2>
                <form id="form-contacto" novalidate>
                    
                    <div class="form-group">
                        <label for="nombre-contacto">NOMBRE COMPLETO</label>
                        <input type="text" id="nombre-contacto" name="nombre" maxlength="100">
                    </div>

                    <div class="form-group">
                        <label for="email-contacto">CORREO ELECTRÓNICO</label>
                        <input type="email" id="email-contacto" name="email" maxlength="100">
                    </div>

                    <div class="form-group">
                        <label for="comentario-contacto">COMENTARIO</label>
                        <textarea id="comentario-contacto" name="comentario" rows="5" maxlength="500" style="width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 6px; font-family: inherit;"></textarea>
                    </div>

                    <button type="submit" class="btn-primary form-btn">Enviar Mensaje</button>
                </form>
            </div>
        </main>
    </div>

    <footer class="main-footer">
        <p>&copy; 2026 Sabor & Aroma - Comida Real, Sabor Auténtico</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/contacto.js"></script>
</body>
</html>
