<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor & AROMA - Registro de Usuario</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <header class="main-header">
        <div class="logo">
            <span class="logo-icon">🍔</span>
            <h1>Sabor & Aroma</h1>
        </div>
        
        <nav class="navbar">
            <ul>
                <li><a href="index.html" class="active">Inicio</a></li>
                <li class="separator">|</li>
                <li><a href="productos.html">Menú</a></li>
                <li class="separator">|</li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li class="separator">|</li>
                <li><a href="blogs.html">Blog Culinario</a></li>
                <li class="separator">|</li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>

        <div class="cart-action">
            <a href="carrito.html" class="cart-btn">🛒 Mi Pedido (0)</a>
        </div>
    </header>


    <div class="container">
        <main class="main-content">
            <div class="form-card">
                <h2>Crear Cuenta</h2>
                <form id="form-registro" novalidate>
                    <div class="form-group">
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" placeholder="ejemplo@gmail.com o @duoc.cl" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn-primary form-btn">Registrarse</button>
                </form>
            </div>
        </main>
    </div>

    <footer class="main-footer">
        <p>&copy; 2026 Sabor & Aroma - Comida Real, Sabor Auténtico</p>
    </footer>

    <script src="js/registro.js"></script>
</body>
</html>
