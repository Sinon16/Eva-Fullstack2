<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor & AROMA - Registro de Usuario</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <header class="main-header">
        <div class="logo">
            <span class="logo-icon">🍔</span>
            <h1>Sabor & Aroma</h1>
        </div>
        
        <nav class="navbar">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li class="separator">|</li>
                <li><a href="productos.html">Menú</a></li>
                <li class="separator">|</li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li class="separator">|</li>
                <li><a href="blogs.html">Blog Culinario</a></li>
                <li class="separator">|</li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>

        <div class="cart-action">
            <a href="carrito.html" class="cart-btn">🛒 Mi Pedido (0)</a>
        </div>
    </header>

    <div class="container">
        <main class="main-content">
            <div class="form-card">
                <h2>Registro de usuario</h2>
                <form id="form-registro" novalidate>
                    
                    <div class="form-group">
                        <label for="nombre">NOMBRE COMPLETO</label>
                        <input type="text" id="nombre" name="nombre">
                    </div>

                    <div class="form-group">
                        <label for="email">CORREO</label>
                        <input type="email" id="email" name="email" maxlength="100">
                    </div>

                    <div class="form-group">
                        <label for="confirmar-email">CORREO (Confirmación)</label>
                        <input type="email" id="confirmar-email" name="confirmar-email" maxlength="100">
                    </div>

                    <div class="form-group">
                        <label for="password">CONTRASEÑA</label>
                        <input type="password" id="password" name="password" maxlength="10">
                    </div>

                    <div class="form-group">
                        <label for="confirmar-password">CONFIRMAR CONTRASEÑA</label>
                        <input type="password" id="confirmar-password" name="confirmar-password" maxlength="10">
                    </div>

                    <div class="form-group">
                        <label for="telefono">TELÉFONO (opcional)</label>
                        <input type="tel" id="telefono" name="telefono">
                    </div>

                    <div style="display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;">
                        <div class="form-group" style="flex: 1; min-width: 200px;">
                            <label for="region">Región</label>
                            <select id="region" name="region">
                                <option value="">-- Seleccione la región --</option>
                            </select>
                        </div>

                        <div class="form-group" style="flex: 1; min-width: 200px;">
                            <label for="comuna">Comuna</label>
                            <select id="comuna" name="comuna" disabled>
                                <option value="">-- Seleccione la comuna --</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary form-btn">Registrarse</button>
                </form>
            </div>
        </main>
    </div>

    <footer class="main-footer">
        <p>&copy; 2026 Sabor & Aroma - Comida Real, Sabor Auténtico</p>
    </footer>

    <script src="js/registro.js"></script>
</body>
</html>
